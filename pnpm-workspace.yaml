packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts (supply-chain hardening: everything else is blocked).
allowBuilds:
  '@prisma/engines': true
  prisma: true
  argon2: true
  '@swc/core': true
  esbuild: true
  # Install-time telemetry pulled in by swagger-ui; explicitly denied.
  '@scarf/scarf': false
  # Optional native accelerator for BullMQ's msgpack; pure-JS fallback is used.
  msgpackr-extract: false

# Local development infrastructure only (PostgreSQL + Redis).
# Ports are bound to 127.0.0.1 so services are not exposed on the network.
name: ai-app-builder

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aab_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aab}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aab

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # BullMQ requires noeviction so queue keys are never evicted under memory pressure.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - aab

volumes:
  postgres-data:
  redis-data:

networks:
  aab:
